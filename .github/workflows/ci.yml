
name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      
      - name: Smoke test CLI
        shell: bash
        run: |
          output=$(printf '120000\n0\n' | java -cp target/classes dev.walid.tax.TaxCalcuBasic)
          echo "$output"
          grep -Fq 'Gross annual income (CAD):' <<< "$output"
          grep -Fq 'Eligible deductions (CAD):' <<< "$output"
          grep -Fq -- '--- Estimate ---' <<< "$output"
          grep -Fq 'Estimated federal tax before credits:' <<< "$output"
          grep -Fq 'Basic personal amount:' <<< "$output"
          grep -Fq 'Estimated federal tax after credits:' <<< "$output"
